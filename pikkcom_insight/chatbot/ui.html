<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>reflexn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --line: #232323;
    --text: #ffffff;
    --text-dim: #7a7a7a;
    --text-faint: #454545;
    --accent: #7C6FEF;
    --error: #e0736b;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  @keyframes ripple { 0% { transform: scale(0.25); opacity: 0.5; } 100% { transform: scale(1); opacity: 0; } }
  @keyframes breathe { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  @keyframes sheen { 0% { left: -60%; } 100% { left: 130%; } }
  @keyframes drift { 0%,100% { transform: translateY(0); opacity: 0.2; } 50% { transform: translateY(-8px); opacity: 0.55; } }
  @keyframes page-in { from { opacity: 0; transform: translateY(10px) scale(0.99); } }
  @keyframes msg-in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes dot-pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .page-enter { animation: page-in 480ms var(--ease-out) backwards; }

  .page { height: 100%; width: 100%; display: flex; flex-direction: column; position: relative; padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }

  .masthead { display: flex; align-items: center; justify-content: space-between; padding: 28px clamp(20px, 4vw, 56px) 18px; border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: baseline; font-family: 'Baloo 2', -apple-system, sans-serif; font-weight: 800; font-size: clamp(20px, 2.4vw, 28px); letter-spacing: 0.5px; }
  .logo .dot { color: var(--accent); margin-left: 2px; }
  .kicker { font-size: 11px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .kicker .mark { margin-top: 0; font-size: clamp(10px, 1.1vw, 12px); letter-spacing: 4px; font-weight: 600; color: var(--text); text-transform: none; white-space: nowrap; }
  .kicker .mark .glyph { color: var(--text-dim); font-size: 0.7em; vertical-align: 0.08em; }

  .foot-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px clamp(20px, 4vw, 56px); border-top: 1px solid var(--line); font-size: 10px; letter-spacing: 2px; color: var(--text-faint); text-transform: uppercase; }

  .corner { position: absolute; width: 14px; height: 14px; opacity: 0.35; }
  .corner::before, .corner::after { content: ''; position: absolute; background: var(--text-dim); }
  .corner::before { width: 100%; height: 1px; top: 50%; }
  .corner::after { height: 100%; width: 1px; left: 50%; }
  .corner.tl { top: 78px; left: clamp(20px, 4vw, 56px); }
  .corner.tr { top: 78px; right: clamp(20px, 4vw, 56px); }
  .corner.bl { bottom: 56px; left: clamp(20px, 4vw, 56px); }
  .corner.br { bottom: 56px; right: clamp(20px, 4vw, 56px); }

  .spine { position: absolute; right: clamp(16px, 3vw, 40px); top: 50%; transform: translateY(-50%) rotate(90deg); transform-origin: center; font-size: 10px; letter-spacing: 4px; color: var(--text-faint); text-transform: uppercase; white-space: nowrap; }

  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 0 20px; }
  .main.started { justify-content: flex-end; }

  .ripple-wrap { position: relative; width: min(34vw, 280px); height: min(34vw, 280px); display: flex; align-items: center; justify-content: center; }
  .ring { position: absolute; width: 22%; height: 22%; border-radius: 50%; border: 1px solid #4a4a4a; animation: ripple 4.5s ease-out infinite; }
  .center-dot { width: 6px; height: 6px; border-radius: 50%; background: #d4d4d4; animation: breathe 4.5s ease-in-out infinite; }
  .mote { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #8a8a8a; animation: drift 4s ease-in-out infinite; }
  .main.started .ripple-wrap, .main.started .hint, .main.started .chips, .main.started .greeting { display: none; }

  @keyframes word-in { from { opacity: 0; filter: blur(6px); transform: translateY(8px); } }
  @keyframes line-in { from { opacity: 0; } }
  .greeting { text-align: center; margin-bottom: 8px; visibility: hidden; }
  .greeting.ready { visibility: visible; }
  .greeting .date { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-faint); animation: line-in 900ms ease backwards; }
  .greeting h1 { margin: 14px 0 0; font-weight: 300; font-size: clamp(26px, 4.2vw, 44px); letter-spacing: -0.5px; line-height: 1.15; color: var(--text-dim); }
  .greeting h1 span { display: inline-block; animation: word-in 900ms var(--ease-out) backwards; }
  .greeting h1 .name { color: var(--text); font-weight: 400; }
  .greeting h1 .dot { color: var(--accent); }
  .greeting .sub { margin-top: 12px; font-size: 14px; color: var(--text-dim); animation: line-in 900ms ease backwards; animation-delay: 700ms; }
  .greeting + .ripple-wrap { width: min(26vw, 200px); height: min(26vw, 200px); }

  .chat-log { display: none; flex-direction: column; gap: 12px; width: min(600px, 92vw); flex: 1; overflow-y: auto; padding: 24px 4px 12px; }
  .main.started .chat-log { display: flex; }
  .msg { max-width: 78%; padding: 11px 15px; border-radius: 16px; font-size: 14px; line-height: 1.5; animation: msg-in 320ms var(--ease-out) backwards; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #1a1a1a; border: 1px solid #2a2a2a; }
  .msg.assistant { align-self: flex-start; background: transparent; border: 1px solid #232323; color: #d8d8d8; }
  .msg.error { align-self: flex-start; border: 1px solid rgba(224,115,107,0.4); color: var(--error); }
  .report-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 14px; border: 1px solid #383838; border-radius: 18px; color: var(--text); text-decoration: none; font-size: 13px; white-space: nowrap; transition: border-color 0.15s ease, background 0.15s ease; }
  .report-link:hover { border-color: var(--accent); background: rgba(124,111,239,0.08); }
  .report-link .arrow { color: var(--accent); }
  .msg.typing { display: flex; gap: 4px; align-items: center; padding: 13px 16px; }
  .msg.typing span { width: 5px; height: 5px; border-radius: 50%; background: var(--text-dim); animation: dot-pulse 1.2s ease-in-out infinite; }
  .msg.typing span:nth-child(2) { animation-delay: 0.15s; }
  .msg.typing span:nth-child(3) { animation-delay: 0.3s; }

  .search-pill { position: relative; margin-top: 5vh; width: min(560px, 88vw); border: 1px solid #383838; border-radius: 32px; padding: 18px 24px; display: flex; align-items: center; gap: 14px; background: #0f0f0f; overflow: hidden; flex-shrink: 0; transition: margin-top 250ms ease; }
  .main.started .search-pill { margin-top: 14px; margin-bottom: 18px; }
  .search-pill .sheen { position: absolute; top: 0; bottom: 0; width: 35%; background: rgba(255,255,255,0.035); animation: sheen 6s ease-in-out infinite; }
  .search-pill input { position: relative; flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 15px; font-family: inherit; }
  .search-pill input::placeholder { color: var(--text-dim); }
  .search-pill input:disabled { opacity: 0.5; }
  .search-pill button { position: relative; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; line-height: 1; padding: 0; }
  .search-pill button:disabled { opacity: 0.3; cursor: default; }

  .hint { margin-top: 16px; font-size: 12px; color: var(--text-faint); text-align: center; }

  .chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 26px; max-width: 560px; }
  .chip { border: 1px solid #262626; border-radius: 18px; padding: 8px 16px; font-size: 12px; color: var(--text-dim); background: none; cursor: pointer; font-family: inherit; transition: border-color 0.15s ease, color 0.15s ease; }
  .chip:hover { border-color: #4a4a4a; color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .page-enter { animation-duration: 1ms !important; }
    .ring, .center-dot, .mote, .sheen, .msg, .msg.typing span, .greeting *, .greeting h1 span { animation: none !important; }
  }
</style>
</head>
<body>

<div class="page page-enter">

  <div class="masthead">
    <div class="logo">PIKKCOM<span class="dot">.</span></div>
    <div class="kicker"><span>Reflexn — Insight Reporting</span><span class="mark">R <span class="glyph">&#10022;</span> X</span></div>
  </div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="spine">Retail Intelligence</div>

  <div class="main" id="main">
    <div class="greeting" id="greeting" aria-live="polite">
      <div class="date" id="greet-date"></div>
      <h1 id="greet-line"></h1>
      <div class="sub">what would you like to explore today?</div>
    </div>

    <div class="ripple-wrap">
      <div class="ring"></div>
      <div class="ring" style="animation-delay:1.5s"></div>
      <div class="ring" style="animation-delay:3s"></div>
      <div class="center-dot"></div>
      <div class="mote" style="top:15%; left:20%; animation-delay:0.5s"></div>
      <div class="mote" style="bottom:18%; right:15%; animation-delay:1.8s"></div>
      <div class="mote" style="top:60%; right:8%; animation-delay:2.6s"></div>
    </div>

    <div class="chat-log" id="chat-log"></div>

    <div class="search-pill">
      <div class="sheen"></div>
      <input type="text" id="query" placeholder="ask for a report..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="send-btn" onclick="sendMessage()" aria-label="submit">&#8594;</button>
    </div>

    <div class="hint">tap to type, or wave to begin</div>

    <div class="chips">
      <button class="chip" onclick="sendMessage(&quot;this month's revenue&quot;)">this month's revenue</button>
      <button class="chip" onclick="sendMessage('sarees performance')">sarees performance</button>
      <button class="chip" onclick="sendMessage('top regions')">top regions</button>
    </div>
  </div>

  <div class="foot-bar">
    <span>A Pikkcom Product</span>
    <span>reflexn.app</span>
  </div>

</div>

<script>
  const chatHistory = [];
  const main = document.getElementById('main');
  const log = document.getElementById('chat-log');
  const input = document.getElementById('query');
  const sendBtn = document.getElementById('send-btn');

  function addBubble(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function addReportLink(bubble, href) {
    const a = document.createElement('a');
    a.className = 'report-link';
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = 'open complete report <span class="arrow">&#8599;</span>';
    bubble.appendChild(document.createElement('br'));
    bubble.appendChild(a);
    log.scrollTop = log.scrollHeight;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function sendMessage(preset) {
    const text = (preset || input.value || '').trim();
    if (!text) return;

    if (!main.classList.contains('started')) main.classList.add('started');

    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;

    addBubble('user', text);
    const priorHistory = chatHistory.slice();
    chatHistory.push({ role: 'user', content: text });
    const typing = addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: priorHistory }),
      });
      const data = await res.json();
      typing.remove();

      if (!res.ok) {
        addBubble('error', data.error || 'something went wrong');
        return;
      }

      const bubble = addBubble('assistant', data.reply || '(no reply)');
      if (data.reportUrl) addReportLink(bubble, data.reportUrl);
      chatHistory.push({ role: 'assistant', content: data.reply || '' });
    } catch (e) {
      typing.remove();
      addBubble('error', 'could not reach the server');
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function showGreeting(username) {
    const h = new Date().getHours();
    const part = h < 5 ? 'good evening' : h < 12 ? 'good morning' : h < 17 ? 'good afternoon' : 'good evening';
    const name = username ? username.charAt(0).toUpperCase() + username.slice(1) : '';
    const words = (part + (name ? ',' : '')).split(' ');
    const line = document.getElementById('greet-line');
    line.innerHTML = '';
    // Each word fades up in turn; the name lands last.
    words.forEach((w, i) => {
      const span = document.createElement('span');
      span.textContent = w;
      span.style.animationDelay = i * 120 + 'ms';
      line.append(span, ' ');
    });
    const tail = document.createElement('span');
    tail.style.animationDelay = words.length * 120 + 'ms';
    if (name) {
      const n = document.createElement('span');
      n.className = 'name';
      n.textContent = name;
      tail.append(n);
    }
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.textContent = '.';
    tail.append(dot);
    line.append(tail);
    document.getElementById('greet-date').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('greeting').classList.add('ready');
  }

  fetch('/api/me')
    .then(async (r) => {
      if (!r.ok) { window.location.href = '/'; return; }
      const me = await r.json();
      showGreeting(me.username);
    })
    .catch(() => showGreeting(''));
</script>

</body>
</html>
