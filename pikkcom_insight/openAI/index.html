<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Retail AI Assistant
    </title>

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f7f7f8;

            color:
                #222;

        }


        .app {

            max-width:
                1000px;

            margin:
                0 auto;

            min-height:
                100vh;

            display:
                flex;

            flex-direction:
                column;

        }


        .header {

            padding:
                24px 20px;

            border-bottom:
                1px solid #e5e5e5;

            background:
                white;

        }


        .header-title {

            font-size:
                22px;

            font-weight:
                700;

        }


        .header-subtitle {

            color:
                #777;

            margin-top:
                5px;

            font-size:
                14px;

        }


        #messages {

            flex:
                1;

            padding:
                30px 20px 140px;

        }


        .message {

            display:
                flex;

            margin-bottom:
                25px;

        }


        .message.user {

            justify-content:
                flex-end;

        }


        .message.assistant {

            justify-content:
                flex-start;

        }


        .bubble {

            max-width:
                78%;

            padding:
                14px 17px;

            border-radius:
                18px;

            line-height:
                1.5;

            font-size:
                15px;

        }


        .user .bubble {

            background:
                #222;

            color:
                white;

            border-bottom-right-radius:
                5px;

        }


        .assistant .bubble {

            background:
                white;

            border:
                1px solid #e5e5e5;

            border-bottom-left-radius:
                5px;

        }


        .assistant-label {

            font-size:
                12px;

            color:
                #777;

            margin-bottom:
                5px;

        }


        .report-card {

            background:
                white;

            border:
                1px solid #e7e7e7;

            border-radius:
                14px;

            padding:
                20px;

            margin:
                15px 0 30px;

        }


        .report-title {

            font-size:
                18px;

            font-weight:
                600;

            margin-bottom:
                20px;

        }


        .chart-wrapper {

            width:
                100%;

            max-height:
                400px;

            margin-bottom:
                25px;

        }


        table {

            width:
                100%;

            border-collapse:
                collapse;

            margin-top:
                15px;

            font-size:
                14px;

        }


        th {

            background:
                #f7f7f7;

            text-align:
                left;

            padding:
                11px;

        }


        td {

            padding:
                11px;

            border-bottom:
                1px solid #eee;

        }


        .sql-details {

            margin-top:
                20px;

        }


        .sql-details summary {

            cursor:
                pointer;

            color:
                #666;

        }


        .sql-box {

            margin-top:
                10px;

            padding:
                12px;

            background:
                #f5f5f5;

            border-radius:
                8px;

            font-family:
                monospace;

            white-space:
                pre-wrap;

            overflow-x:
                auto;

        }


        .typing {

            color:
                #777;

            font-size:
                14px;

            margin:
                5px 0 20px;

        }


        .input-area {

            position:
                fixed;

            bottom:
                0;

            left:
                0;

            right:
                0;

            background:
                linear-gradient(
                    transparent,
                    #f7f7f8 30%
                );

            padding:
                35px 20px 25px;

        }


        .input-container {

            max-width:
                960px;

            margin:
                auto;

            background:
                white;

            border:
                1px solid #ddd;

            border-radius:
                22px;

            display:
                flex;

            align-items:
                flex-end;

            padding:
                10px 10px 10px 16px;

            box-shadow:
                0 3px 14px
                rgba(0,0,0,0.08);

        }


        #messageInput {

            flex:
                1;

            border:
                none;

            outline:
                none;

            resize:
                none;

            font-family:
                inherit;

            font-size:
                16px;

            min-height:
                26px;

            max-height:
                140px;

            padding:
                7px 5px;

        }


        #sendButton {

            width:
                42px;

            height:
                42px;

            border-radius:
                50%;

            border:
                none;

            background:
                #111;

            color:
                white;

            font-size:
                21px;

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

        }


        #sendButton:hover {

            background:
                #333;

        }


        #sendButton:disabled {

            opacity:
                0.5;

            cursor:
                default;

        }


        .error {

            color:
                #b00020;

            margin:
                10px 0;

        }


        @media (
            max-width: 600px
        ) {

            .bubble {

                max-width:
                    90%;

            }

            #messages {

                padding-left:
                    12px;

                padding-right:
                    12px;

            }

        }

    </style>

</head>


<body>


<div class="app">


    <div class="header">

        <div class="header-title">

            Retail AI Assistant

        </div>

        <div class="header-subtitle">

            Ask about sales, products, stores and performance

        </div>

    </div>



    <div id="messages">


        <div class="message assistant">

            <div>

                <div class="assistant-label">

                    AI Assistant

                </div>

                <div class="bubble">

                    Hi! I'm your retail analytics assistant.
                    Ask me about sales, products, stores or trends.

                </div>

            </div>

        </div>


    </div>


</div>



<div class="input-area">


    <div class="input-container">


        <textarea
            id="messageInput"
            rows="1"
            placeholder="Ask anything about your retail data..."
        ></textarea>


        <button
            id="sendButton"
            onclick="sendMessage()"
            title="Send"
        >

            ➤

        </button>


    </div>


</div>



<script>


let conversationHistory = [];


let chartCounter = 0;



async function sendMessage() {


    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const message =
        input.value.trim();



    if (!message) {

        return;

    }



    addUserMessage(
        message
    );


    /*
     * Send previous history only.
     * The current message is passed separately.
     */
    const historyForRequest =
        [...conversationHistory];


    conversationHistory.push({
        role: "user",
        content: message
    });


    input.value = "";


    resizeTextarea();


    button.disabled = true;


    const typingId =
        showTyping();



    try {


        const response =
            await fetch(

                "http://127.0.0.1:8000/chat",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            history:
                                historyForRequest

                        })

                }

            );



        const data =
            await response.json();



        removeTyping(
            typingId
        );



        if (!response.ok) {

            throw new Error(

                data.detail ||
                "Backend request failed."

            );

        }



        addAssistantMessage(
            data.message
        );



        conversationHistory.push({

            role:
                "assistant",

            content:
                data.message

        });



        if (
            data.type ===
            "analytics"
        ) {


            addReport(
                data
            );


        }


    }

    catch (error) {


        removeTyping(
            typingId
        );


        addAssistantMessage(

            "I couldn't process that request. " +
            error.message,

            true

        );


    }

    finally {


        button.disabled =
            false;


        input.focus();


    }


}



function addUserMessage(
    text
) {


    const messages =
        document.getElementById(
            "messages"
        );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message user";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    wrapper.appendChild(
        bubble
    );


    messages.appendChild(
        wrapper
    );


    scrollBottom();


}



function addAssistantMessage(
    text,
    isError = false
) {


    const messages =
        document.getElementById(
            "messages"
        );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message assistant";


    const inner =
        document.createElement(
            "div"
        );


    const label =
        document.createElement(
            "div"
        );


    label.className =
        "assistant-label";


    label.textContent =
        "AI Assistant";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    if (isError) {

        bubble.classList.add(
            "error"
        );

    }


    bubble.textContent =
        text;


    inner.appendChild(
        label
    );


    inner.appendChild(
        bubble
    );


    wrapper.appendChild(
        inner
    );


    messages.appendChild(
        wrapper
    );


    scrollBottom();


}



function showTyping() {


    const messages =
        document.getElementById(
            "messages"
        );


    const id =
        "typing-" +
        Date.now();


    const typing =
        document.createElement(
            "div"
        );


    typing.id =
        id;


    typing.className =
        "typing";


    typing.textContent =
        "AI Assistant is thinking...";


    messages.appendChild(
        typing
    );


    scrollBottom();


    return id;


}



function removeTyping(
    id
) {


    const element =
        document.getElementById(
            id
        );


    if (element) {

        element.remove();

    }


}



function addReport(
    data
) {


    const messages =
        document.getElementById(
            "messages"
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "report-card";



    const title =
        document.createElement(
            "div"
        );


    title.className =
        "report-title";


    title.textContent =
        data.title ||
        "Report";


    card.appendChild(
        title
    );



    if (
        data.chart &&
        data.rows &&
        data.rows.length > 0
    ) {


        chartCounter++;


        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "chart-wrapper";


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.id =
            "chart-" +
            chartCounter;


        wrapper.appendChild(
            canvas
        );


        card.appendChild(
            wrapper
        );


        setTimeout(
            () => {

                renderChart(
                    canvas,
                    data
                );

            },
            0
        );


    }



    if (
        data.rows &&
        data.rows.length > 0
    ) {


        const table =
            createTable(
                data.rows
            );


        card.appendChild(
            table
        );


    }



    if (data.sql) {


        const details =
            document.createElement(
                "details"
            );


        details.className =
            "sql-details";


        const summary =
            document.createElement(
                "summary"
            );


        summary.textContent =
            "View generated SQL";


        const sql =
            document.createElement(
                "div"
            );


        sql.className =
            "sql-box";


        sql.textContent =
            data.sql;


        details.appendChild(
            summary
        );


        details.appendChild(
            sql
        );


        card.appendChild(
            details
        );


    }



    messages.appendChild(
        card
    );


    scrollBottom();


}



function createTable(
    rows
) {


    const table =
        document.createElement(
            "table"
        );


    const headers =
        Object.keys(
            rows[0]
        );


    const thead =
        document.createElement(
            "thead"
        );


    const headerRow =
        document.createElement(
            "tr"
        );



    headers.forEach(
        header => {


            const th =
                document.createElement(
                    "th"
                );


            th.textContent =
                formatHeader(
                    header
                );


            headerRow.appendChild(
                th
            );


        }
    );


    thead.appendChild(
        headerRow
    );


    table.appendChild(
        thead
    );



    const tbody =
        document.createElement(
            "tbody"
        );



    rows.forEach(
        row => {


            const tr =
                document.createElement(
                    "tr"
                );


            headers.forEach(
                header => {


                    const td =
                        document.createElement(
                            "td"
                        );


                    td.textContent =
                        formatValue(
                            header,
                            row[header]
                        );


                    tr.appendChild(
                        td
                    );


                }
            );


            tbody.appendChild(
                tr
            );


        }
    );


    table.appendChild(
        tbody
    );


    return table;


}



function formatHeader(
    header
) {


    return header

        .replaceAll(
            "_",
            " "
        )

        .replace(
            /\b\w/g,
            char =>
                char.toUpperCase()
        );


}



function formatValue(
    column,
    value
) {


    if (
        typeof value ===
        "number"
    ) {


        const name =
            column.toLowerCase();


        if (
            name.includes(
                "sales"
            ) ||

            name.includes(
                "revenue"
            ) ||

            name.includes(
                "amount"
            )
        ) {


            return (
                "₹" +
                value.toLocaleString(
                    "en-IN"
                )
            );


        }


        return value.toLocaleString(
            "en-IN"
        );


    }


    return value;


}



function renderChart(
    canvas,
    data
) {


    const x =
        data.chart.x;


    const y =
        data.chart.y;


    const labels =
        data.rows.map(
            row =>
                row[x]
        );


    const values =
        data.rows.map(
            row =>
                row[y]
        );


    new Chart(
        canvas,
        {

            type:
                data.chart.type,

            data: {

                labels:
                    labels,

                datasets: [

                    {

                        label:
                            data.title,

                        data:
                            values,

                        borderWidth:
                            2,

                        fill:
                            false

                    }

                ]

            },

            options: {

                responsive:
                    true,

                maintainAspectRatio:
                    true,

                plugins: {

                    legend: {

                        display:
                            data.chart.type
                            === "pie"

                    }

                },

                scales:

                    data.chart.type ===
                    "pie"

                    ? {}

                    : {

                        y: {

                            beginAtZero:
                                true

                        }

                    }

            }

        }
    );


}



function scrollBottom() {


    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });


}



const input =
    document.getElementById(
        "messageInput"
    );


input.addEventListener(
    "input",
    resizeTextarea
);


input.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {


            event.preventDefault();


            sendMessage();


        }


    }
);



function resizeTextarea() {


    input.style.height =
        "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            140
        ) + "px";


}


</script>


</body>

</html>
