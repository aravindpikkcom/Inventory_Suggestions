<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>reflexn — sign in</title>
<style>
  :root {
    --bg: #0a0a0a;
    --border: #262626;
    --border-soft: #2a2a2a;
    --text: #ffffff;
    --text-dim: #6b6b6b;
    --text-faint: #3a3a3a;
    --error: #e0736b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #050505; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top,24px) 16px env(safe-area-inset-bottom,24px); }

  .screen { width: 100%; max-width: 340px; height: 640px; background: var(--bg); border: 1px solid var(--border); border-radius: 24px; padding: 48px 28px; display: flex; flex-direction: column; box-sizing: border-box; }

  .logo-mark { text-align: center; letter-spacing: 4px; font-size: 17px; color: var(--text); font-weight: 600; }
  .logo-mark .glyph { color: var(--text-dim); font-size: 12px; vertical-align: 2px; }
  .subtitle { text-align: center; font-size: 10px; color: var(--text-dim); letter-spacing: 1px; margin-top: 6px; }

  .tabs { display: flex; margin-top: 44px; border: 1px solid var(--border-soft); border-radius: 8px; overflow: hidden; }
  .tab { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; color: var(--text-dim); background: transparent; border: none; cursor: pointer; font-family: inherit; }
  .tab.active { color: var(--text); background: #1a1a1a; }

  .fields { margin-top: 26px; display: flex; flex-direction: column; gap: 16px; }
  .fields input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-soft); color: var(--text); font-size: 14px; padding: 10px 2px; outline: none; font-family: inherit; }
  .fields input::placeholder { color: var(--text-dim); }
  .fields input:focus { border-bottom-color: var(--text); }
  .field-confirm { display: none; }
  .screen.mode-create .field-confirm { display: block; }
  .screen.mode-create #forgot { display: none; }

  .message { margin-top: 14px; font-size: 11px; min-height: 14px; text-align: center; }
  .message.error { color: var(--error); }
  .message.success { color: #9fd8a8; }

  .continue-btn { margin-top: 18px; text-align: center; padding: 12px 0; border: 1px solid var(--text); border-radius: 8px; font-size: 13px; letter-spacing: 1px; color: var(--text); background: transparent; cursor: pointer; font-family: inherit; }
  .continue-btn:hover { background: var(--text); color: #000; }
  .continue-btn:disabled { opacity: 0.5; cursor: default; background: transparent; color: var(--text); }

  #forgot { margin-top: auto; text-align: center; font-size: 11px; color: var(--text-dim); background: none; border: none; cursor: pointer; font-family: inherit; }
  .credit { text-align: center; font-size: 9px; color: var(--text-faint); letter-spacing: 1px; margin-top: 6px; }
</style>
</head>
<body>

  <div class="screen" id="screen">
    <div class="logo-mark">R <span class="glyph">&#10022;</span> X</div>
    <div class="subtitle">insight reporting</div>

    <div class="tabs">
      <button class="tab active" id="tab-signin" onclick="setMode('signin')" type="button">Sign in</button>
      <button class="tab" id="tab-create" onclick="setMode('create')" type="button">Create account</button>
    </div>

    <form class="fields" id="auth-form">
      <input type="text" id="username" placeholder="username" autocomplete="username" required>
      <input type="password" id="password" placeholder="password" autocomplete="current-password" required>
      <input type="password" id="confirm" placeholder="confirm password" autocomplete="new-password" class="field-confirm">
    </form>

    <div class="message" id="message"></div>

    <button class="continue-btn" id="continue-btn" onclick="submitForm()">CONTINUE</button>

    <button id="forgot" type="button">forgot password</button>
    <div class="credit">a pikkcom product</div>
  </div>

<script>
  let mode = 'signin';

  function setMode(next) {
    mode = next;
    const screen = document.getElementById('screen');
    const tabSignin = document.getElementById('tab-signin');
    const tabCreate = document.getElementById('tab-create');
    const btn = document.getElementById('continue-btn');

    screen.classList.toggle('mode-create', next === 'create');
    tabSignin.classList.toggle('active', next === 'signin');
    tabCreate.classList.toggle('active', next === 'create');
    btn.textContent = next === 'create' ? 'CREATE ACCOUNT' : 'CONTINUE';
    setMessage('');
  }

  function setMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text || '';
    el.className = 'message' + (type ? ' ' + type : '');
  }

  async function submitForm() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const btn = document.getElementById('continue-btn');

    if (!username || !password) {
      setMessage('enter a username and password', 'error');
      return;
    }
    if (mode === 'create' && password !== confirm) {
      setMessage('passwords do not match', 'error');
      return;
    }

    const endpoint = mode === 'create' ? '/api/signup' : '/api/login';
    btn.disabled = true;
    setMessage('');

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        setMessage(data.error || 'something went wrong', 'error');
        return;
      }

      setMessage(mode === 'create' ? 'account created — signing you in' : 'signed in', 'success');
      // Hand off to the rest of the app here, e.g.:
      // window.location.href = '/landing.html';
    } catch (e) {
      setMessage('could not reach the server', 'error');
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
